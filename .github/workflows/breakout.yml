name: Breakout Scanner

on:
  schedule:
    # כל חצי שעה בשעות המסחר בארה"ב (UTC) — מכסה שעון קיץ וחורף
    - cron: '*/30 13-21 * * 1-5'
  workflow_dispatch:
    inputs:
      test:
        description: 'Send test message'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy scipy requests

      - name: Run breakout scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ALLOWED_CHAT_IDS: ${{ secrets.ALLOWED_CHAT_IDS }}
          TEST_MODE: ${{ inputs.test }}
        run: python scanner.py

      - name: Save alert state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add alerted.json
          git diff --cached --quiet || (git commit -m "Update alert state [skip ci]" && git push)

